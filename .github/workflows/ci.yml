name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix: { node: [20, 22] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate --schema=src/shared/db/postgres/schema.prisma
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
